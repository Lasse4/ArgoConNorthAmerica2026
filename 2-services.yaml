# Argo Rollouts points these at the stable and the canary pods
apiVersion: v1
kind: Service
metadata:
  name: assistant-stable
spec:
  selector:
    app: assistant
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-canary
spec:
  selector:
    app: assistant
  ports:
    - port: 8000
      targetPort: 8000
